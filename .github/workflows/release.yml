name: Create a Release
on:
  push:
    branches:
    - master
  workflow_dispatch:
    inputs:
      release_type:
        description: SemVer segment to bump
        type: choice
        default: patch
        options:
        - patch
        - minor
        - major
        - build
defaults:
  run:
    shell: bash
permissions:
  contents: write
env:
  project-name: qBitrr
  GREN_GITHUB_TOKEN: ${{ secrets.PAT }}
jobs:
  prepare_release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message || '', '[patch]') ||
      startsWith(github.event.head_commit.message || '', '[minor]') ||
      startsWith(github.event.head_commit.message || '', '[major]') ||
      startsWith(github.event.head_commit.message || '', '[build]')
    outputs:
      release_type: ${{ steps.release_type.outputs.value }}
      new_version: ${{ steps.version.outputs.value }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}
        ref: master
    - name: Determine release type
      id: release_type
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type || '' }}
      run: |
        if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
          type="${INPUT_RELEASE_TYPE:-patch}"
          echo "value=${type}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        case "${COMMIT_MESSAGE}" in
          "[patch]"*)
            type="patch"
            ;;
          "[minor]"*)
            type="minor"
            ;;
          "[major]"*)
            type="major"
            ;;
          "[build]"*)
            type="build"
            ;;
          *)
            echo "Commit message must begin with [patch], [minor], [major], or [build]." >&2
            exit 1
            ;;
        esac

        echo "value=${type}" >> "${GITHUB_OUTPUT}"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install release tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        python -m pip install bump2version build twine
    - name: Bump project version
      env:
        RELEASE_TYPE: ${{ steps.release_type.outputs.value }}
      run: bump2version "${RELEASE_TYPE}"
    - name: Capture new version
      id: version
      run: |
        VERSION=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
        echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "New version: ${VERSION}"
    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v7.0.0
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true
    - name: Commit version bump
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: '[skip ci] Bump version to v${{ steps.version.outputs.value }}'
        commit_options: -S
        commit_user_name: ${{ steps.import_gpg.outputs.name }}
        commit_user_email: ${{ steps.import_gpg.outputs.email }}
        commit_author: ${{ steps.import_gpg.outputs.name }} <${{ steps.import_gpg.outputs.email }}>
  create_release:
    name: Create GitHub release draft
    runs-on: ubuntu-latest
    needs:
    - prepare_release
    if: needs.prepare_release.result == 'success'
    outputs:
      release_tag: ${{ steps.check_release.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.exists }}
      release_id: ${{ steps.release_id.outputs.id }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.PAT }}
    - name: Check if release exists
      id: check_release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v${{ needs.prepare_release.outputs.new_version }}"
        echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
        if gh release view "${TAG}" --repo ${{ github.repository }} >/dev/null 2>&1; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
          echo "⚠ Release ${TAG} already exists, will not create duplicate"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
          echo "✓ Release ${TAG} does not exist, will create"
        fi

    - name: Create draft release
      id: create_draft
      if: steps.check_release.outputs.exists != 'true'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.PAT }}
        tag_name: v${{ needs.prepare_release.outputs.new_version }}
        name: v${{ needs.prepare_release.outputs.new_version }}
        draft: true
        prerelease: false
        make_latest: false

    - name: Resolve release ID
      id: release_id
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        TAG: ${{ steps.check_release.outputs.tag }}
        DRAFT_ID: ${{ steps.create_draft.outputs.id }}
      run: |
        if [ -n "${DRAFT_ID}" ]; then
          echo "id=${DRAFT_ID}" >> "${GITHUB_OUTPUT}"
          echo "✓ Using softprops draft release ID ${DRAFT_ID}"
          exit 0
        fi

        # Prefer published release by tag; fall back to draft match (API lists drafts)
        RELEASE_ID="$(gh release view "${TAG}" --repo ${{ github.repository }} --json databaseId --jq .databaseId 2>/dev/null || true)"
        if [ -z "${RELEASE_ID}" ]; then
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)"
        fi

        if [ -z "${RELEASE_ID}" ]; then
          echo "❌ ERROR: Could not resolve release ID for ${TAG}" >&2
          exit 1
        fi

        echo "id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
        echo "✓ Resolved existing release ID ${RELEASE_ID} for ${TAG}"
  docker_images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs:
    - prepare_release
    - create_release
    if: needs.prepare_release.result == 'success'
    env:
      VERSION: ${{ needs.prepare_release.outputs.new_version }}
      RELEASE_TYPE: ${{ needs.prepare_release.outputs.release_type }}
    steps:
    - id: repo
      uses: ASzc/change-string-case-action@v8
      with:
        string: ${{ github.repository }}
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
    - uses: docker/setup-qemu-action@v4
      with:
        cache-image: false
    - uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4.5.2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.REG_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          feramance/qbitrr
          ghcr.io/${{ steps.repo.outputs.lowercase }}
        tags: |
          type=raw,value=latest
          type=raw,value=stable,enable=${{ env.RELEASE_TYPE != 'build' }}
          type=raw,value=v${{ env.VERSION }}
    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
  package_binaries:
    name: Build release binaries
    runs-on: ${{ matrix.os }}
    needs:
    - prepare_release
    - create_release
    if: needs.prepare_release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        python:
        - 3.12.2
        os:
        - windows-2025-vs2026
        - macOS-latest
        - ubuntu-latest
        arch:
        - x64
        - arm64
        exclude:
        - os: ubuntu-latest
          arch: arm64
        - os: macOS-latest
          arch: x64
        - os: windows-2025-vs2026
          arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: master
        fetch-depth: 0
    - name: Install Homebrew dependencies
      if: runner.os == 'macOS'
      run: "/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\n"
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
        cache: ${{ runner.os != 'macOS' && 'pip' || '' }}
        cache-dependency-path: |
          setup.cfg
          pyproject.toml
    - name: Install APT dependencies
      if: runner.os == 'Linux'
      run: "sudo apt-get update\nsudo apt-get install libsdl2-dev\n"
    - name: Set archive name
      id: archive
      env:
        VERSION: ${{ needs.prepare_release.outputs.new_version }}
      run: |
        ARCHIVE_NAME="${{ env.project-name }}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
        echo "Archive name set to: ${ARCHIVE_NAME}"
        echo "NAME=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Build web UI assets
      run: "cd webui\nnpm ci\nnpm run build\n"
    - name: Install Python dependencies
      run: "python -m pip install -U pip\npython -m pip install -U setuptools==69.5.1\npython -m pip install -U wheel\npython -m pip install -e '.[dev]'\n"
    - name: Run PyInstaller
      env:
        PYTHONOPTIMIZE: 1
        PYTHONHASHSEED: 42
        PYTHONUNBUFFERED: 1
      run: "pyinstaller build.spec\n"
    - name: List distribution files
      run: "find dist\n"
    - name: Tar files
      if: runner.os != 'Windows'
      run: |
        tar --format=ustar -czvf ${{ steps.archive.outputs.NAME }}.tar.gz dist/
        sha256sum ${{ steps.archive.outputs.NAME }}.tar.gz | tee ${{ steps.archive.outputs.NAME }}.tar.gz.sha256
    - name: Archive files
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive dist/* ${{ steps.archive.outputs.NAME }}.zip
        $hash = (Get-FileHash -Algorithm SHA256 "${{ steps.archive.outputs.NAME }}.zip").Hash.ToLower()
        Set-Content -Path "${{ steps.archive.outputs.NAME }}.zip.sha256" -Value "$hash  ${{ steps.archive.outputs.NAME }}.zip"
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: automated-build-${{ steps.archive.outputs.NAME }}
        path: ${{ steps.archive.outputs.NAME }}.*
        if-no-files-found: error
    - name: Upload release assets
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.PAT }}
        file: ${{ steps.archive.outputs.NAME }}.*
        file_glob: true
        tag: v${{ needs.prepare_release.outputs.new_version }}
        overwrite: true
        # Draft releases are not findable by tag; target the softprops draft by ID
        release_id: ${{ needs.create_release.outputs.release_id }}
        draft: ${{ needs.create_release.outputs.release_exists != 'true' }}
        release_name: v${{ needs.prepare_release.outputs.new_version }}
        make_latest: false
  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    needs:
    - prepare_release
    - docker_images
    - package_binaries
    if: needs.prepare_release.result == 'success'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Build web UI assets
      run: "cd webui\nnpm ci\nnpm run build\n"
    - name: Install build dependencies
      run: "python -m pip install --upgrade pip\npip install build wheel\n"
    - name: Build package
      run: python -m build
    - name: Check if version exists on PyPI
      id: pypi_check
      run: |
        VERSION="${{ needs.prepare_release.outputs.new_version }}"
        if pip index versions qbitrr2 2>/dev/null | grep -q "qbitrr2 (${VERSION})"; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
          echo "Version ${VERSION} already exists on PyPI, skipping upload"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
          echo "Version ${VERSION} does not exist on PyPI, will upload"
        fi
    - name: Publish package
      if: steps.pypi_check.outputs.exists != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
  changelog:
    name: Generate changelog and release notes
    runs-on: ubuntu-latest
    needs:
    - prepare_release
    - publish_pypi
    - create_release
    if: needs.prepare_release.result == 'success'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - uses: actions/setup-node@v7
      with:
        node-version: latest
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Install release notes tooling
      run: npm install github-release-notes -g
    - name: Generate release notes and changelog
      env:
        VERSION: ${{ needs.prepare_release.outputs.new_version }}
      run: |
        set -e
        set -o pipefail  # But allow pipe failures we explicitly handle

        echo "Fetching all tags and commits..."
        git fetch --all --tags

        echo "Current tags:"
        git tag -l | tail -10

        echo "Skipping gren release (release already created as draft)..."
        echo "Note: Release notes will be populated from changelog in publish_release job"

        echo "Skipping gren changelog (using Python fallback for better control)..."
        echo "Generating changelog entry manually with grouped categories..."
        python3 <<'PYEOF'
        import os
        import subprocess
        import sys
        from datetime import datetime

        def categorize_commit(message):
            """Categorize a commit message and return the group"""
            msg_lower = message.lower()

            # Check for explicit prefixes
            if any(x in message for x in ['[minor]', '[major]', 'feat:', 'feature:']):
                return '🚀 Features'
            if 'Add ' in message or 'Implement ' in message:
                return '🚀 Features'

            if any(x in message for x in ['[patch]', 'fix:', 'Fix ', 'Fixed ', 'Hotfix']):
                return '🐛 Bug Fixes'

            if any(x in message for x in ['[build]', 'dependabot']):
                return '🔧 Maintenance'

            if any(x in message for x in ['docs:', 'doc:', 'Document ']):
                return '📝 Documentation'

            if 'refactor:' in msg_lower or 'Refactor' in message:
                return '♻️ Refactoring'

            if 'style:' in msg_lower or 'UI ' in message or 'WebUI ' in message:
                return '🎨 Styling'

            if any(x in msg_lower for x in ['perf:', 'performance:', 'optimize:']):
                return '⚡ Performance'

            if any(x in message for x in ['chore:', 'build:', 'ci:', 'Bump ', 'Update ', 'Merge ']):
                return '🔧 Maintenance'

            # Default to bug fixes if it starts with "Fix" or maintenance for everything else
            if message.startswith('Fix '):
                return '🐛 Bug Fixes'

            return '🔧 Maintenance'

        version = os.environ['VERSION']
        tag = f"v{version}"

        # Previous tag: newest existing tag that is not the release being generated.
        # The new tag may not exist yet (create_release can run in parallel), so use HEAD
        # as the end ref instead of requiring the new tag locally.
        prev_tag = ""
        all_tags_cmd = subprocess.run(
            ['git', 'tag', '--sort=-version:refname'],
            capture_output=True, text=True, check=True
        )
        tags = [
            t.strip()
            for t in all_tags_cmd.stdout.strip().split('\n')
            if t.strip() and t.strip() != tag
        ]
        if tags:
            prev_tag = tags[0]
            print(f"Found previous tag: {prev_tag}")

        if not prev_tag:
            print("⚠ Could not find any previous tag - this appears to be the first release")
            print("❌ ERROR: Cannot generate changelog without a previous reference point")
            sys.exit(1)

        # Get commits since previous tag up to current master (includes version bump commit)
        print(f"Getting commits between {prev_tag} and HEAD...")
        commits_cmd = subprocess.run(
            ['git', 'log', f'{prev_tag}..HEAD', '--format=%H %s', '--no-merges'],
            capture_output=True, text=True
        )
        if commits_cmd.returncode != 0:
            print(f"❌ ERROR: git log failed between {prev_tag} and HEAD")
            print(commits_cmd.stderr.strip())
            sys.exit(1)

        commits = [
            line for line in commits_cmd.stdout.strip().split('\n')
            if line and '[skip ci]' not in line and '[ci skip]' not in line
        ]

        # Empty ranges happen on build-only bumps (only [skip ci] version/changelog commits)
        if not commits:
            print(f"⚠ No user-facing commits between {prev_tag} and HEAD")
            print("Writing maintenance stub entry for dependency / automation release")

        print(f"Found {len(commits)} commits to include in changelog")

        # Read existing changelog
        with open('CHANGELOG.md', 'r') as f:
            content = f.read()

        # Find the position to insert new entry
        date_str = datetime.now().strftime('%d/%m/%Y')
        header = f"## v{version} ({date_str})\n"

        if header not in content:
            # Group commits by category
            grouped = {}
            for commit in commits[:50]:  # Limit to 50 commits
                if not commit.strip():
                    continue
                try:
                    hash_val, msg = commit.split(' ', 1)
                    category = categorize_commit(msg)
                    if category not in grouped:
                        grouped[category] = []
                    grouped[category].append(f"- [{msg}](https://github.com/Feramance/qBitrr/commit/{hash_val}) - @Feramance")
                except ValueError:
                    print(f"⚠ Skipping malformed commit line: {commit}")
                    continue

            if not grouped:
                grouped['🔧 Maintenance'] = [
                    f"- Dependency / automation release (no user-facing commits since {prev_tag})"
                ]

            # Build entry with groups
            entry = header
            group_order = [
                '🚀 Features',
                '🐛 Bug Fixes',
                '📝 Documentation',
                '♻️ Refactoring',
                '🎨 Styling',
                '⚡ Performance',
                '🔧 Maintenance'
            ]

            for group in group_order:
                if group in grouped:
                    entry += f"\n### {group}\n"
                    for commit_line in grouped[group]:
                        entry += f"{commit_line}\n"

            entry += "\n---\n\n"

            # Insert after "# Changelog\n\n"
            changelog_start = content.find("# Changelog\n\n")
            if changelog_start >= 0:
                insert_pos = changelog_start + len("# Changelog\n\n")
                new_content = content[:insert_pos] + entry + content[insert_pos:]

                with open('CHANGELOG.md', 'w') as f:
                    f.write(new_content)
                print(f"✓ Manually generated changelog for v{version}")
            else:
                print("⚠ Could not find changelog header")
                sys.exit(1)
        else:
            print(f"✓ Changelog for v{version} already exists")
        PYEOF

        # Verify changelog was updated
        if ! git diff --quiet CHANGELOG.md; then
          echo "✓ Changelog successfully updated"
          # Show stats instead of full diff to avoid SIGPIPE
          git diff --stat CHANGELOG.md
          echo "First 20 lines of new changelog entry:"
          git diff CHANGELOG.md | grep "^+" | head -20 || echo "Could not preview changes"
        else
          echo "⚠ Warning: Changelog was not modified"
          echo "Checking if entry already exists..."
          if grep -q "## v${VERSION}" CHANGELOG.md; then
            echo "✓ Entry for v${VERSION} already exists in changelog"
          else
            echo "❌ ERROR: No changelog entry for v${VERSION}"
            exit 1
          fi
        fi
    - name: Import GPG key
      id: changelog_gpg
      uses: crazy-max/ghaction-import-gpg@v7.0.0
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true
    - name: Check for changelog changes
      id: changelog_check
      run: |
        if git diff --quiet CHANGELOG.md; then
          echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          echo "No changelog changes detected"
        else
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "Changelog changes detected"
        fi

    - name: Commit changelog updates
      if: steps.changelog_check.outputs.has_changes == 'true'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: '[skip ci] Update changelog for v${{ needs.prepare_release.outputs.new_version }}'
        commit_options: -S
        commit_user_name: ${{ steps.changelog_gpg.outputs.name }}
        commit_user_email: ${{ steps.changelog_gpg.outputs.email }}
        commit_author: ${{ steps.changelog_gpg.outputs.name }} <${{ steps.changelog_gpg.outputs.email }}>
  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
    - prepare_release
    - create_release
    - changelog
    if: needs.prepare_release.result == 'success'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.PAT }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Pull latest changelog updates
      run: |
        echo "Pulling latest changes from master (including changelog updates)..."
        git pull origin master
        echo "✓ Latest changes pulled"

    - name: Extract release notes from changelog
      id: extract_notes
      env:
        VERSION: ${{ needs.prepare_release.outputs.new_version }}
      run: |
        TAG="v${VERSION}"
        echo "Extracting changelog for ${TAG}..."

        # Extract the changelog entry for this version
        python3 <<'PYEOF'
        import os
        import re
        import sys

        version = os.environ['VERSION']
        tag = f"v{version}"

        with open('CHANGELOG.md', 'r') as f:
            content = f.read()

        # Find this version's entry
        pattern = rf'## (v{re.escape(version)}) \((\d{{2}}/\d{{2}}/\d{{4}})\)\n(.*?)(?=\n---\n\n|\Z)'
        match = re.search(pattern, content, re.DOTALL)

        if match:
            body = match.group(3).strip()
            if body:
                # Write to file for gh CLI
                with open('/tmp/release_notes.md', 'w') as f:
                    f.write(body)
                print(f"✓ Extracted {len(body)} characters for {tag}")
                sys.exit(0)
            else:
                print(f"⚠ Changelog entry for {tag} is empty")
                sys.exit(1)
        else:
            print(f"⚠ Could not find changelog entry for {tag}")
            print(f"This might mean the changelog job failed to generate it.")
            print(f"The release will be published without detailed notes.")
            # Create a minimal release note
            repo = "${{ github.repository }}"
            with open('/tmp/release_notes.md', 'w') as f:
                f.write(f"Release {tag}\n\nSee [CHANGELOG.md](https://github.com/{repo}/blob/master/CHANGELOG.md) for details.")
            sys.exit(0)
        PYEOF

    - name: Publish release
      if: steps.extract_notes.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ needs.create_release.outputs.release_tag }}"
        echo "Publishing release ${TAG}, updating notes, and marking as latest..."
        gh release edit "${TAG}" \
          --notes-file /tmp/release_notes.md \
          --draft=false \
          --latest \
          --repo ${{ github.repository }}
        echo "✓ Release ${TAG} published successfully"

    - name: Clean up stale draft for current tag
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ needs.create_release.outputs.release_tag }}"
        echo "Checking for stale drafts matching ${TAG}..."
        DRAFT_IDS="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id")"

        if [ -z "${DRAFT_IDS}" ]; then
          echo "No stale drafts found for ${TAG}"
          exit 0
        fi

        while IFS= read -r release_id; do
          if [ -n "${release_id}" ]; then
            echo "Deleting stale draft release ID ${release_id} for ${TAG}..."
            gh api -X DELETE "repos/${{ github.repository }}/releases/${release_id}" || echo "⚠ Failed to delete draft ${release_id}"
          fi
        done <<< "${DRAFT_IDS}"

        echo "✓ Current-tag draft cleanup complete"
concurrency:
  group: release
  cancel-in-progress: true
