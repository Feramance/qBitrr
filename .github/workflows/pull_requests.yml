name: PR Build Checks
on:
  pull_request:
    branches:
    - master
    - releases/**
defaults:
  run:
    shell: bash
permissions:
  contents: read
env:
  project-name: qBitrr
jobs:
  unittest:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || github.token }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12.2
        cache: pip
        cache-dependency-path: |
          setup.cfg
          pyproject.toml
    - name: Install Python dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -e '.[dev]'
    - name: Run unit tests
      run: |
        TMPDIR=$(mktemp -d)
        QBITRR_OVERRIDES_DATA_PATH="$TMPDIR" python -m unittest discover -s tests -p 'test_*.py' -v
  frontend-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || github.token }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Run frontend tests
      run: |
        cd webui
        npm ci
        npm run test
  drift-checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || github.token }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12.2
        cache: pip
        cache-dependency-path: |
          setup.cfg
          pyproject.toml
    - name: Install Python dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -e '.[dev]'
    - name: Check config fields drift
      run: python scripts/config_fields_check.py --check-reload
    - name: Check OpenAPI drift
      run: python scripts/openapi_check.py
  package:
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python:
        - 3.12.2
        os:
        - windows-2025-vs2026
        - macOS-latest
        - ubuntu-latest
        arch:
        - x64
        - arm64
        exclude:
        - os: ubuntu-latest
          arch: arm64
        - os: macOS-latest
          arch: x64
        - os: windows-2025-vs2026
          arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || github.token }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Install Homebrew dependencies
      if: runner.os == 'macOS'
      run: |
        brew install sdl2
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
        cache: ${{ runner.os != 'macOS' && 'pip' || '' }}
        cache-dependency-path: |
          setup.cfg
          pyproject.toml
    - name: Install APT dependencies
      if: runner.os == 'Linux'
      run: "sudo apt-get update\nsudo apt-get install libsdl2-dev\n"
    - name: Retrieve current version
      id: current_version
      run: |
        VERSION=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
        echo "Current version: ${VERSION}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
    - name: Set archive name
      id: archive
      run: |
        ARCHIVE_NAME="${{ env.project-name }}-${{ steps.current_version.outputs.VERSION }}-pr${{ github.event.pull_request.number }}-${{ matrix.os }}-${{ matrix.arch }}"
        echo "Archive name set to: $ARCHIVE_NAME"
        echo "NAME=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Build web UI assets
      run: "cd webui\nnpm ci\nnpm run build\n"
    - name: Install Python dependencies
      run: "python -m pip install -U pip\npython -m pip install -U setuptools==69.5.1\npython -m pip install -U wheel\npython -m pip install -e '.[dev]'\n"
    - name: Run PyInstaller
      env:
        PYTHONOPTIMIZE: 1
        PYTHONHASHSEED: 42
        PYTHONUNBUFFERED: 1
      run: "pyinstaller build.spec\n# This step exists for debugging.  Such as checking if data files were included correctly by PyInstaller.\n"
    - name: List distribution files
      run: "find dist\n# Archive the PyInstaller build using the appropriate tool for the platform.\n"
    - name: Tar files
      if: runner.os != 'Windows'
      run: "tar --format=ustar -czvf ${{ steps.archive.outputs.NAME }}.tar.gz dist/\n"
    - name: Archive files
      if: runner.os == 'Windows'
      shell: pwsh
      run: "Compress-Archive dist/* ${{ steps.archive.outputs.NAME }}.zip\n"
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: automated-build-${{ steps.archive.outputs.NAME }}
        path: ${{ steps.archive.outputs.NAME }}.*
        if-no-files-found: error
  docker_image:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        platform:
        - amd64
        - arm64
    steps:
    - id: string
      uses: ASzc/change-string-case-action@v8
      with:
        string: ${{ github.repository }}
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        token: ${{ secrets.PAT || github.token }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        cache-image: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      if: github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to Container registry
      if: github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.REG_TOKEN }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: "feramance/qbitrr\nghcr.io/${{ steps.string.outputs.lowercase }}\n"
        tags: type=ref,event=pr${{ matrix.platform == 'arm64' && ',suffix=-arm' || '' }}
    - name: Build and push Docker images
      env:
        DOCKER_BUILDKIT: 1
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/${{ matrix.platform }}
        push: ${{ github.actor != 'dependabot[bot]' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
