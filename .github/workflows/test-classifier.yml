name: Test GitHub Classifier

on:
  push:
    branches: [master]
    paths:
    - .github/automation/classification-policy.json
    - .github/scripts/classify_work_item.py
    - .github/scripts/tests/**
    - .github/workflows/classify-issues.yml
    - .github/workflows/classify-prs.yml
  pull_request:
    paths:
    - .github/automation/classification-policy.json
    - .github/scripts/classify_work_item.py
    - .github/scripts/tests/**
    - .github/workflows/classify-issues.yml
    - .github/workflows/classify-prs.yml

permissions:
  contents: read

jobs:
  classifier-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
