name: Classify Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: classify-${{ github.repository }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
    - name: Check out trusted base branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.base.sha || 'master' }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Classify pull request
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      run: python .github/scripts/classify_work_item.py pr --number "$PR_NUMBER"
